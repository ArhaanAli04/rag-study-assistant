# Continuous integration: every PR into develop/master, and every push to them, must pass
# the backend tests, the frontend tests + production build, and both Docker image builds.
# The job names below are the required status checks in branch protection — renaming a job
# means updating the protection rules on both branches, or every PR blocks forever.
name: CI

on:
  # pull_request (not pull_request_target): runs with the PR's code but without secrets or a
  # write token, so an untrusted PR can't reach anything worth stealing.
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # T2 (Day 13): the same Postgres as docker compose (pg17 + pgvector 0.8.2, as on Supabase), used
    # to prove the Alembic baseline and the repositories on Postgres. Throwaway and only reachable
    # from this job, so `trust` auth: no password needs to live in this file.
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: rag
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Docker image and Render; the host venv is 3.12.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Same system packages as the Dockerfile's runtime stage: the PPTX tests reach the OCR path.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng poppler-utils postgresql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # B3: the contrib OpenCV build must be written last (see requirements.in), as in the Dockerfile.
          pip install --no-deps --force-reinstall opencv-contrib-python-headless==4.12.0.88
          # CI-only tool, pinned; rules live in ruff.toml.
          pip install ruff==0.15.18

      - name: Ruff
        run: ruff check . --output-format github

      # Values only for this job, generated so no secret-looking literal sits in the repo:
      # rag_app's password (the init script requires one), and the required Settings fields that
      # alembic/env.py's `from app.core.config import settings` validates. Masked in the log.
      - name: Postgres - generate throwaway credentials
        run: |
          for name in RAG_APP_PASSWORD GEMINI_API_KEY JWT_SECRET_KEY GOOGLE_CLIENT_SECRET; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          echo "GOOGLE_CLIENT_ID=ci.apps.googleusercontent.com" >> "$GITHUB_ENV"
          echo "GOOGLE_REDIRECT_URI=http://localhost:8000/auth/google/callback" >> "$GITHUB_ENV"

      # Same script docker compose runs, so CI, local and Supabase share one shape: role rag_app
      # owning schema rag, search_path = rag, extensions, pgvector in `extensions`.
      - name: Postgres - create the rag schema and rag_app role
        env:
          PGHOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_DB: rag
        run: sh scripts/postgres/init-rag-schema.sh

      # The timeline's Day 13 check: an empty database migrates to head, and autogenerate finds no
      # difference between the models and the migrated schema. Connected as rag_app, so the
      # current_schema() guard in app/db/migrations.py runs too.
      - name: Postgres - alembic upgrade head and alembic check
        env:
          DATABASE_SCHEMA: rag
        run: |
          export DATABASE_URL="postgresql+psycopg://rag_app:${RAG_APP_PASSWORD}@localhost:5432/rag"
          alembic upgrade head
          alembic check

      # Postgres compares types strictly: a filter like Document.user_id == str(user.id) passes on
      # SQLite and fails here ("operator does not exist: integer = character varying"), so it fails
      # CI instead of production. The full suite below still runs on SQLite until Day 14.
      - name: Postgres - repository tests
        run: |
          export TEST_POSTGRES_URL="postgresql+psycopg://rag_app:${RAG_APP_PASSWORD}@localhost:5432/rag"
          python -m pytest backend/tests/test_repositories.py -q

      # No secrets on purpose: tests/conftest.py supplies dummy keys, fakes Gemini, Tavily and
      # Redis, and refuses network sockets.
      - name: Pytest
        run: python -m pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match Vercel's Node.js Version setting (24.x) and frontend/Dockerfile.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Actions sets CI=true: Jest runs once, and the CRA build fails on ESLint warnings the
      # same way Vercel's does.
      - run: npm test -- --watchAll=false

      - run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The image Render builds; fails here before it fails there.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
