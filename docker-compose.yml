# Shared, production-like stack: the backend image Render builds and the nginx frontend build.
#   docker compose up --build                        → dev (this file + docker-compose.override.yml)
#   docker compose -f docker-compose.yml up --build  → this file alone, as deployed
services:
  # ==================== Backend Service ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-backend
    ports:
      - "8000:8000"
    # Secrets and settings come from .env; `environment` overrides the few values that differ
    # inside the container (the host-run .env points Redis at localhost:6380).
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      # Own DB, so flushing the query/web caches in DB 0 leaves cached answers alone (T3)
      - SEMANTIC_CACHE_REDIS_URL=redis://redis:6379/1
      - TESSERACT_PATH=/usr/bin/tesseract
      - FRONTEND_URL=http://localhost:3000
      # Day 14: the compose Postgres, on the network name `postgres`. Overrides the host-side
      # localhost:5433 URL that .env holds for the venv. The password is interpolated from .env,
      # so none lives in this file.
      - DATABASE_URL=postgresql+psycopg://rag_app:${RAG_APP_PASSWORD:?}@postgres:5432/rag
      - DATABASE_SCHEMA=rag
    volumes:
      # Runtime state in Docker-managed volumes, so it survives container recreation and never
      # lands in the working tree. The image pre-creates these directories owned by `app`.
      # Day 7 moved the mount points from /app/src/*; the named volumes (and their data) are the same.
      - data:/app/backend/data
      - uploads:/app/backend/uploads
      - logs:/app/backend/logs
    depends_on:
      redis:
        condition: service_healthy
      # `alembic upgrade head` runs first thing in the container, so Postgres must accept connections.
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network

  # ==================== Frontend Service ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # CRA inlines REACT_APP_* at build time; without this, `npm run build` reads
        # .env.production and the bundle calls the Render backend.
        - REACT_APP_API_URL=http://localhost:8000
    container_name: rag-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - rag-network

  # ==================== Postgres Service (T2, Day 13) ====================
  # Local stand-in for Supabase: same major version (17), the same pgvector version (0.8.2, so dev
  # can't use a feature production lacks), and the same rag schema / rag_app role / search_path
  # (scripts/postgres/init-rag-schema.sh). The app's database since Day 14, for the Docker backend
  # and the venv (host port 5433); the old SQLite file stays in the `data` volume, unused.
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    container_name: rag-postgres
    ports:
      # Host port 5433, not 5432, so this can run alongside another project's Postgres
      - "5433:5432"
    environment:
      # No defaults: passwords live only in .env (compose reads it for ${...}), never in the repo.
      # `:?` makes both required; a missing one stops every `docker compose` command. Set them in
      # .env as .env.example shows. (A custom message after `?` reads as a literal password to
      # GitGuardian's generic detector, so the bare form is used.)
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=rag
      - RAG_APP_PASSWORD=${RAG_APP_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty volume only. Changing the script later needs `docker compose down`
      # plus removing the pgdata volume.
      - ./scripts/postgres/init-rag-schema.sh:/docker-entrypoint-initdb.d/10-rag-schema.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - rag-network

  # ==================== Redis Service ====================
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      # Host port 6380, not 6379, so this can run alongside another project's Redis
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - rag-network

# ==================== Volumes ====================
volumes:
  pgdata:
  redis-data:
  data:
  uploads:
  logs:

# ==================== Networks ====================
networks:
  rag-network:
    driver: bridge
