# Continuous integration: every PR into develop/master, and every push to them, must pass
# the backend tests, the frontend tests + production build, and both Docker image builds.
# The job names below are the required status checks in branch protection — renaming a job
# means updating the protection rules on both branches, or every PR blocks forever.
name: CI

on:
  # pull_request (not pull_request_target): runs with the PR's code but without secrets or a
  # write token, so an untrusted PR can't reach anything worth stealing.
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Docker image and Render; the host venv is 3.12.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Same system packages as the Dockerfile's runtime stage: the PPTX tests reach the OCR path.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # CI-only tool, pinned; rules live in ruff.toml.
          pip install ruff==0.15.18

      - name: Ruff
        run: ruff check . --output-format github

      # No secrets on purpose: tests/conftest.py supplies dummy keys, fakes Gemini, Tavily and
      # Redis, and refuses network sockets.
      - name: Pytest
        run: python -m pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match Vercel's Node.js Version setting (24.x) and frontend/Dockerfile.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Actions sets CI=true: Jest runs once, and the CRA build fails on ESLint warnings the
      # same way Vercel's does.
      - run: npm test -- --watchAll=false

      - run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The image Render builds; fails here before it fails there.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
